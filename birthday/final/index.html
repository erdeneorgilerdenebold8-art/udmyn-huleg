function txt(el,s){if(el)el.textContent=s}
async function fetchPhotoText(url){
  const r=await fetch(url,{cache:'force-cache'});
  if(!r.ok) throw new Error(url+' '+r.status);
  const b64=(await r.text()).replace(/\s+/g,'');
  if(!b64) throw new Error('empty '+url);
  const mime=b64.startsWith('UklGR')?'image/webp':(b64.startsWith('iVBOR')?'image/png':'image/jpeg');
  return `data:${mime};base64,${b64}`;
}
async function loadPhotos(){
  const urls=[
    '../assets/p1.txt','../assets/p2.txt','../assets/p3.txt','../assets/p4.txt','../assets/p5.txt','../assets/p6.txt',
    'https://happy-birthday-oyunzaya-v2.vercel.app/p7.txt',
    'https://happy-birthday-oyunzaya-v2.vercel.app/p8.txt',
    'https://happy-birthday-oyunzaya-v2.vercel.app/p9.txt',
    'https://happy-birthday-oyunzaya-v2.vercel.app/p10.txt'
  ];
  const fallback=i=>`https://happy-birthday-oyunzaya-v2.vercel.app/p${i+1}.txt`;
  const out=[];
  for(let i=0;i<urls.length;i++){
    try{out.push(await fetchPhotoText(urls[i]));}
    catch(e){out.push(await fetchPhotoText(fallback(i)));}
  }
  const seen=new Set();
  return out.filter(src=>{if(seen.has(src))return false;seen.add(src);return true;});
}
async function ensurePhotos(d){
  const holder=d.querySelector('#photos'); if(!holder)return;
  const sec=holder.closest('section'); if(sec)sec.style.display='block';
  if(holder.dataset.finalPhotos==='ready')return;
  if(holder.dataset.loading==='1')return;
  holder.dataset.loading='1';
  holder.innerHTML='<div style="padding:22px;color:#8d8881;font-size:12px">зурагнууд ачаалж байна…</div>';
  try{
    const items=await loadPhotos();
    holder.innerHTML='';
    items.forEach((src,i)=>{
      const b=d.createElement('button'); b.className='photo rv in'; b.type='button';
      b.innerHTML=`<img src="${src}" alt="memory ${i+1}" loading="lazy" decoding="async"><span class="cap">${PHOTO_CAPS[i]||'memory'}</span><span class="num">${String(i+1).padStart(2,'0')}</span>`;
      b.onclick=()=>{const overlay=d.querySelector('#lightbox,.light');const img=d.querySelector('#lbImg,.light img');if(overlay&&img){img.src=src;overlay.classList.add('on');d.body.classList.add('lock')}};
      holder.appendChild(b);
    });
    holder.dataset.finalPhotos='ready';
  }catch(e){
    holder.innerHTML='<div style="padding:24px;color:#8d8881;font-size:12px">Зураг ачаалалт саатлаа. Refresh хийгээд үзээрэй.</div>';
    console.error(e)
  } finally {holder.dataset.loading='0';}
}

ill="#ffe08f"/><g fill="#d8d0f3"><circle cx="0" cy="-18" r="12"/><circle cx="18" cy="0" r="12"/><circle cx="0" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/></g></g><g transform="translate(222 60)"><circle r="14" cx="0" cy="0" fill="#ffd77f"/><g fill="#f6bccd"><circle cx="0" cy="-18" r="12"/><circle cx="18" cy="0" r="12"/><circle cx="0" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/></g></g></g><path d="M140 248 L118 144 L162 144 Z" fill="#d7b893" opacity=".85"/></svg></div><div class="rio-wrap"><div class="rio-card"><div class="can pink"><div class="top"></div><div class="label">RIO</div><div class="subc">peach mix</div><div class="fruit"></div></div><div class="can"><div class="top"></div><div class="label">RIO</div><div class="subc">blue mix</div><div class="fruit"></div></div></div></div></div></div>`;
  d.body.appendChild(modal);
  const open=sec.querySelector('#finalGiftOpen'), close=modal.querySelector('.final-gift-x');
  open.onclick=()=>{modal.classList.add('on');d.body.classList.add('lock')};
  close.onclick=()=>{modal.classList.remove('on');d.body.classList.remove('lock')};
  modal.onclick=e=>{if(e.target===modal){modal.classList.remove('on');d.body.classList.remove('lock')}};
}

  d.querySelectorAll('section').forEach(sec=>{if(sec.id==='finalGiftSection')return;const t=(sec.textContent||'').toLowerCase();if(t.includes('хадгалаад авмаар')||t.includes('worth keeping')||t.includes('ralph waldo')||t.includes('emily dickinson')||t.includes('walt whitman')||t.includes('энэ сайтыг хийхдээ')||t.includes('making of')||t.includes('дотно болчихсон')||t.includes('яаж ийгээд танилцсан'))sec.remove()});
  const hidden=d.querySelector('#hidden,#note');if(hidden){const hs=hidden.closest('section');if(hs)hs.remove();else hidden.remove();}
  const fx=d.querySelector('#wishfx,#fx,#finalfx');if(fx){const h=fx.querySelector('h4'),p=fx.querySelector('p'),b=fx.querySelector('#fxClose,#fc,#fxclose');txt(h,'за нэг юм асууя 😂');if(p)p.innerHTML='арай Rio хүсээгүй биз? 😂<br>эсвэл billiard дээрээ сайжирмаар байна гэж хүсээгүй биз хаха';txt(b,'за больё 😂')}
  const last=d.querySelector('.last');if(last)last.innerHTML='<h3 class="rv in reveal show">төрсөн өдрийн мэнд, эгчээ 🎂</h3>';
