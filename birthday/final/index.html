<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF9F6"><title>Оюунзаяа эгчээ — төрсөн өдрийн мэнд</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAF9F6}iframe{display:block;border:0;width:100%;height:100svh;background:#FAF9F6}</style></head><body><iframe id="site" src="../?v=genz-final-3" allow="autoplay; fullscreen"></iframe><script>const f=document.getElementById('site');function patch(){try{const d=f.contentDocument;if(!d||!d.body)return;const style=d.createElement('style');style.textContent='.note-card:before{content:"just for today"!important}.quote-card span,.quote-card cite,.last-author{display:none!important}.quote-card strong{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif!important;font-size:21px!important;font-weight:700!important;line-height:1.35!important}.note-card blockquote{display:none!important}';if(!d.getElementById('genzPatchStyle')){style.id='genzPatchStyle';d.head.appendChild(style)}const msg=d.querySelector('#message');if(msg)msg.innerHTML='<p class="greeting-line">Төрсөн өдрийн мэнд ээ, эгчээ 🤍</p><p>Шинэ насандаа яг хүссэнээрээ амьдардаг, очмоор газраа очдог, авахыг хүссэн юмаа авдаг байгаарай 😂</p><p>Хэрэггүй stress бага, гоё хүмүүс их, random азтай мөчүүд олон байг.</p><p>Өнөөдрөө зүгээр л гоё өнгөрүүл. cake-аа ид. зургаа ав. enjoy 😌</p><div class="foot"><span>from your дүү</span><span>28.08.2026</span></div>';const msec=msg&&msg.closest('section');if(msec){const e=msec.querySelector('.eyebrow');if(e)e.textContent='just saying'}const q=d.querySelector('#quotes');if(q){const sec=q.closest('section');const e=sec.querySelector('.eyebrow');const h=sec.querySelector('.title');if(e)e.textContent='2026 wishlist';if(h)h.innerHTML='энэ жилдээ:';q.innerHTML='<article class="quote-card reveal in"><strong>илүү их аялал, бага stress.</strong></article><article class="quote-card reveal in"><strong>мөнгө нь хүрдэг биш — илүүддэг жил байг 😂</strong></article><article class="quote-card reveal in"><strong>“өнөөдөр гоё байлаа” гэж бодоод унтдаг өдөр олон байг.</strong></article>'}const hidden=d.querySelector('#hidden');if(hidden)hidden.innerHTML='<span class="eyebrow">okay one more thing</span><b>за нэг үнэн юм хэлчихье… +</b><div>Хааяа хэлдэггүй л болохоос танд нэлээн хайртай шүү 😂<br>за энэ хэсгийг screenshot хийж болохгүй.</div>';const fx=d.querySelector('#wishfx');if(fx){const h=fx.querySelector('h4'),p=fx.querySelector('p'),b=fx.querySelector('#fxClose');if(h)h.textContent='wish saved.';if(p)p.innerHTML='арай Rio хүсээгүй биз? 😂<br>эсвэл billiard дээрээ сайжирмаар байна гэж хүсээгүй биз хаха<br><br>юу ч хүссэн байсан secret хэвээр нь үлдээе 🤝';if(b)b.textContent='за за 😂'}const last=d.querySelector('.last');if(last)last.innerHTML='<div class="eyebrow reveal in">one last thing</div><p class="reveal in">За ингээд энэ site-г хийсэн болохоор<br>birthday gift-ийн quota-гаа хаалаа гэж бодъё 😂</p><h3 class="reveal in">төрсөн өдрийн мэнд, эгчээ 🤍</h3>';d.querySelectorAll('*').forEach(el=>{if(el.childNodes.length===1&&el.firstChild.nodeType===3&&/Ralph Waldo|Emily Dickinson|Walt Whitman/.test(el.textContent))el.style.display='none'})}catch(e){}}f.addEventListener('load',()=>{patch();let n=0;const t=setInterval(()=>{patch();if(++n>12)clearInterval(t)},250)});</script></body></html>
