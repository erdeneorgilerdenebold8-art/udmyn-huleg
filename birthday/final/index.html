<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF9F6"><title>Оюунзаяа эгчээ — төрсөн өдрийн мэнд</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAF9F6}iframe{display:block;border:0;width:100%;height:100svh;background:#FAF9F6}</style><script src="./assets/hq_part1.js"></script><script src="./assets/hq_part2.js"></script><script src="./assets/hq_part3.js"></script><script src="./assets/hq_part4.js"></script></head><body><iframe id="site" src="../?v=genz-final-photo-fix-2" allow="autoplay; fullscreen"></iframe><script>
const f=document.getElementById('site');

function txt(el,s){if(el)el.textContent=s}
function imageWorks(src){return new Promise(r=>{const im=new Image();let done=false;const finish=v=>{if(done)return;done=true;r(v)};im.onload=()=>finish(true);im.onerror=()=>finish(false);im.src=src;setTimeout(()=>finish(false),4500)})}
async function fallbackPhoto(i){const hosts=i<6?[V1,V2]:[V2];for(const host of hosts){try{const res=await fetch(`${host}/p${i+1}.txt`,{cache:'force-cache'});if(!res.ok)continue;const t=(await res.text()).trim();if(t.length>1000)return 'data:image/jpeg;base64,'+t}catch(e){}}throw new Error('photo '+(i+1))}
async function loadPhotos(){const partial=[...(window.HQ_PHOTOS_PART1||[]),...(window.HQ_PHOTOS_PART2||[]),...(window.HQ_PHOTOS_PART3||[]),...(window.HQ_PHOTOS_PART4||[])];const out=[];for(let i=0;i<10;i++){let src=partial[i]||null;if(src&&!(await imageWorks(src)))src=null;if(!src)src=await fallbackPhoto(i);out.push(src)}return out}
async function ensurePhotos(d){const holder=d.querySelector('#photos');if(!holder)return;const sec=holder.closest('section');if(sec)sec.style.display='block';if(holder.dataset.finalPhotos==='ready'&&holder.children.length===10)return;if(holder.dataset.loading==='1')return;holder.dataset.loading='1';holder.innerHTML='<div style="padding:24px;color:#8d8881;font-size:12px">зургууд ачаалж байна…</div>';try{const items=await loadPhotos();holder.innerHTML='';items.forEach((src,i)=>{const b=d.createElement('button');b.className='photo rv in';b.type='button';b.innerHTML=`<img src="${src}" alt="memory ${i+1}" loading="eager" decoding="async"><span class="cap">${PHOTO_CAPS[i]}</span><span class="num">${String(i+1).padStart(2,'0')}</span>`;b.onclick=()=>{const overlay=d.querySelector('#lightbox,.light');const img=d.querySelector('#lbImg,.light img');if(overlay&&img){img.src=src;overlay.classList.add('on');d.body.classList.add('lock')}};holder.appendChild(b)});holder.dataset.finalPhotos='ready'}catch(e){console.error(e);holder.innerHTML='<div style="padding:24px;color:#8d8881;font-size:12px">Зураг ачаалалт саатлаа. Нэг refresh хийгээд үзээрэй.</div>'}finally{holder.dataset.loading='0'}}
function ensureStory(d){if(d.getElementById('finalStorySection'))return;const stats=[...d.querySelectorAll('section')].find(s=>/2026 stats|totally scientific/i.test(s.textContent||''));const sec=d.createElement('section');sec.id='finalStorySection';sec.className='sec w final-story';sec.innerHTML=`<div class="ey rv in">short version</div><h3 class="title rv in">яаж ийгээд<br>дотно болчихсон.</h3><div class="final-story-list"><div><i>01</i><span>Хятадад танилцсан</span></div><div><i>02</i><span>сүүлдээ нэлээн ойртсон</span></div><div><i>03</i><span>эгч гэж дуудах хэмжээнд хүрсэн</span></div><div><i>04</i><span>одоо бүр birthday website хийж сууна 💀</span></div></div>`;if(stats&&stats.parentNode)stats.parentNode.insertBefore(sec,stats);else d.querySelector('main,.site')?.appendChild(sec)}
function ensureGift(d){if(d.getElementById('finalGiftSection'))return;const allSections=[...d.querySelectorAll('section')];const cakeSec=allSections.find(s=>/wish time|хүслээ бод/i.test(s.textContent||''));const sec=d.createElement('section');sec.id='finalGiftSection';sec.className='final-gift-sec';sec.innerHTML=`<div class="final-gift-inner"><div class="final-gift-ey">gift</div><h3>бэлэг 🎁</h3><button id="finalGiftOpen" type="button">нээх</button></div>`;if(cakeSec&&cakeSec.parentNode)cakeSec.parentNode.insertBefore(sec,cakeSec);else d.querySelector('main,.site')?.appendChild(sec);const modal=d.createElement('div');modal.id='finalGiftModal';modal.className='final-gift-modal';modal.innerHTML=`<div class="final-gift-card"><button class="final-gift-x" type="button" aria-label="close">×</button><div class="final-gift-ey">gift unlocked</div><h3>за энэ байна 😂</h3><div class="final-gift-grid"><figure><img src="${FLOWER_IMG}" referrerpolicy="no-referrer" alt="pink flower bouquet"><figcaption>цэцэг 🌷</figcaption></figure><div class="final-rio"><img src="${RIO_IMG_1}" referrerpolicy="no-referrer" alt="RIO peach cocktail"><img src="${RIO_IMG_2}" referrerpolicy="no-referrer" alt="RIO strong cocktail"><span>RIO × 2</span></div></div></div>`;d.body.appendChild(modal);const open=sec.querySelector('#finalGiftOpen'),close=modal.querySelector('.final-gift-x');open.onclick=()=>{modal.classList.add('on');d.body.classList.add('lock')};close.onclick=()=>{modal.classList.remove('on');d.body.classList.remove('lock')};modal.onclick=e=>{if(e.target===modal){modal.classList.remove('on');d.body.classList.remove('lock')}}}
function patch(){try{const d=f.contentDocument;if(!d||!d.body)return;if(!d.getElementById('finalHQPatch')){const style=d.createElement('style');style.id='finalHQPatch';style.textContent=`.card:before{content:'for you'!important}.card blockquote,.orig,.mn,.author{display:none!important}.photo{visibility:visible!important;opacity:1!important;filter:none!important;transform:none!important}.photo img{width:100%!important;height:auto!important;object-fit:contain!important;filter:none!important;transform:none!important;image-rendering:auto!important}.light img,.lightbox img{width:auto!important;height:auto!important;max-width:96vw!important;max-height:92svh!important;object-fit:contain!important;filter:none!important}#photos{min-height:120px!important}.level{display:none!important}.final-story-list{display:grid;gap:0;margin-top:24px;border-top:1px solid #e8e3dc}.final-story-list>div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid #e8e3dc;align-items:center}.final-story-list i{font-style:normal;font-size:9px;color:#a29b94}.final-story-list span{font-size:20px;letter-spacing:-.035em}.final-gift-sec{width:min(calc(100% - 34px),760px);margin:0 auto;padding:72px 0 88px}.final-gift-inner{background:#171719;color:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 22px 55px #0002}.final-gift-ey{font-size:10px;letter-spacing:.12em;color:#8d8881;text-transform:lowercase}.final-gift-inner .final-gift-ey{color:#fff8}.final-gift-inner h3{font-size:clamp(40px,11vw,58px);line-height:.95;letter-spacing:-.06em;margin:8px 0 22px}.final-gift-inner button{border:0;border-radius:999px;background:#faf9f6;color:#171719;padding:14px 24px;font-weight:650;min-width:120px}.final-gift-modal{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:16px;background:#111d;backdrop-filter:blur(16px)}.final-gift-modal.on{display:grid}.final-gift-card{position:relative;width:min(100%,720px);max-height:90svh;overflow:auto;border-radius:30px;background:#faf9f6;padding:26px 20px 22px;box-shadow:0 35px 90px #0006}.final-gift-card h3{font-size:clamp(34px,9vw,52px);letter-spacing:-.06em;margin:8px 0 22px}.final-gift-x{position:absolute;right:12px;top:12px;width:42px;height:42px;border:0;border-radius:50%;background:#ebe7e1;font-size:24px}.final-gift-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.final-gift-grid figure,.final-rio{margin:0;border:1px solid #e8e2dc;border-radius:24px;background:#fff;overflow:hidden;min-height:300px}.final-gift-grid figure img{display:block;width:100%;height:340px;object-fit:cover}.final-gift-grid figcaption,.final-rio span{display:block;padding:10px 12px;color:#817b74;font-size:11px}.final-rio{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:14px 8px 0}.final-rio img{width:100%;height:260px;object-fit:contain;background:#fff}.final-rio span{grid-column:1/-1;text-align:center}@media(max-width:560px){.final-gift-grid{grid-template-columns:1fr}.final-gift-grid figure img{height:310px}.final-rio img{height:230px}.final-gift-grid figure,.final-rio{min-height:0}.final-story-list span{font-size:18px}}`;d.head.appendChild(style)}d.querySelectorAll('.level').forEach(x=>x.remove());d.querySelectorAll('.cake,.cakebody').forEach(x=>{if((x.textContent||'').trim()==='+1')x.textContent='🎂'});const msg=d.querySelector('#message,.card');if(msg){msg.innerHTML=`<p class="greet">Төрсөн өдрийн мэнд ээ, эгчээ 🎂</p><p>Эрүүл, аз жаргалтай, мөнгөтэй байгаарай 😂</p><p>Хүссэн юмаа хийж, хүссэн газраа явж, хэрэггүй юманд нервтэх нь багасаасай.</p><p>Урт юм бичвэл cringe болно. Ингээд боллоо 😂</p><div class="foot"><span>from your дүү</span><span>28.08.2026</span></div>`;const s=msg.closest('section');if(s){const e=s.querySelector('.ey,.eyebrow,.lab');if(e)e.textContent='birthday note'}}d.querySelectorAll('.title').forEach(h=>{if(/China dump/i.test(h.textContent||''))h.textContent='random memories'});d.querySelectorAll('section').forEach(sec=>{if(sec.id==='finalGiftSection'||sec.id==='finalStorySection')return;const t=(sec.textContent||'').toLowerCase();if(t.includes('хадгалаад авмаар')||t.includes('worth keeping')||t.includes('ralph waldo')||t.includes('emily dickinson')||t.includes('walt whitman')||t.includes('энэ сайтыг хийхдээ')||t.includes('making of'))sec.remove()});const hidden=d.querySelector('#hidden,#note');if(hidden)hidden.innerHTML='<span class="ey">one extra thing</span><b>за нэг юм хэлчихье… +</b><div>Яаж ийгээд танилцсан, яаж ийгээд миний эгч болсон. Надад бол pretty good plot twist 😂</div>';const fx=d.querySelector('#wishfx,#fx,#finalfx');if(fx){const h=fx.querySelector('h4'),p=fx.querySelector('p'),b=fx.querySelector('#fxClose,#fc,#fxclose');txt(h,'за нэг юм асууя 😂');if(p)p.innerHTML='арай Rio хүсээгүй биз? 😂<br>эсвэл billiard дээрээ сайжирмаар байна гэж хүсээгүй биз хаха';txt(b,'за больё 😂')}const last=d.querySelector('.last');if(last)last.innerHTML='<h3 class="rv in reveal show">төрсөн өдрийн мэнд, эгчээ 🎂</h3>';const end=d.querySelector('.end');if(end){end.querySelectorAll('p,small').forEach(x=>x.remove())}d.querySelectorAll('footer').forEach(x=>x.remove());ensureStory(d);ensurePhotos(d);ensureGift(d)}catch(e){console.error(e)}}
