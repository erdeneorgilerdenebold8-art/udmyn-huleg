<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF9F6"><title>Оюунзаяа эгчээ — төрсөн өдрийн мэнд</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAF9F6}iframe{display:block;border:0;width:100%;height:100svh;background:#FAF9F6}</style></head><body><iframe id="site" src="../?v=genz-final-hq1" allow="autoplay; fullscreen"></iframe><script>
const f=document.getElementById('site');
const PHOTO_CAPS=['Central Perk era','iconic','helmet arc','Shanghai night','random day','core memory','0.5x energy','room chaos','close enough 😂','fashion week at home'];
const HQ_BUNDLE='https://happy-birthday-oyunzaya-v4-fixed.vercel.app/?hq=1';
function txt(el,s){if(el)el.textContent=s}
async function loadHQ(){
  const boot=await fetch(HQ_BUNDLE,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('bundle');return r.text()});
  const m=boot.match(/atob\('([^']+)'\)/); if(!m) throw Error('payload');
  if(typeof DecompressionStream==='undefined') throw Error('decompression');
  const bytes=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const imgs=[...html.matchAll(/data:image\/(?:avif|jpeg|webp);base64,[A-Za-z0-9+/=]+/g)].map(x=>x[0]);
  if(imgs.length<10) throw Error('photos '+imgs.length);
  return imgs.slice(0,10);
}
async function ensurePhotos(d){
  const holder=d.querySelector('#photos'); if(!holder)return;
  const sec=holder.closest('section'); if(sec)sec.style.display='block';
  if(holder.dataset.finalPhotos==='hq'&&holder.children.length===10)return;
  holder.innerHTML='<div style="padding:24px;color:#8d8881;font-size:12px">high quality зургууд ачаалж байна…</div>';
  try{
    const items=await loadHQ();
    holder.innerHTML='';
    items.forEach((src,i)=>{
      const b=d.createElement('button'); b.className='photo rv in'; b.type='button';
      b.innerHTML=`<img src="${src}" alt="memory ${i+1}" loading="lazy" decoding="async"><span class="cap">${PHOTO_CAPS[i]}</span><span class="num">${String(i+1).padStart(2,'0')}</span>`;
      b.onclick=()=>{const overlay=d.querySelector('#lightbox,.light');const img=d.querySelector('#lbImg,.light img');if(overlay&&img){img.src=src;overlay.classList.add('on');d.body.classList.add('lock')}};
      holder.appendChild(b);
    });
    holder.dataset.finalPhotos='hq';
  }catch(e){
    holder.innerHTML='<div style="padding:24px;color:#8d8881;font-size:12px">Зураг ачаалалт саатлаа. Нэг refresh хийгээрэй.</div>';
    console.error('HQ photos',e);
  }
}
function patch(){try{
  const d=f.contentDocument;if(!d||!d.body)return;
  if(!d.getElementById('finalHQPatch')){
    const style=d.createElement('style');style.id='finalHQPatch';style.textContent=`
      .card:before{content:'for you'!important}.card blockquote,.orig,.mn,.author{display:none!important}
      .photo{visibility:visible!important;opacity:1!important;filter:none!important}.photo img{width:100%!important;height:auto!important;object-fit:contain!important;filter:none!important;transform:none!important;image-rendering:auto!important}
      .light img,.lightbox img{width:auto!important;height:auto!important;max-width:96vw!important;max-height:92svh!important;object-fit:contain!important;filter:none!important}
      #photos{min-height:120px!important}.level{display:none!important}
    `;d.head.appendChild(style)
  }
  d.querySelectorAll('.level').forEach(x=>x.remove());
  d.querySelectorAll('.cake,.cakebody').forEach(x=>{if((x.textContent||'').trim()==='+1')x.textContent='🎂'});
  const msg=d.querySelector('#message,.card');
  if(msg){msg.innerHTML=`<p class="greet">Төрсөн өдрийн мэнд ээ, эгчээ 🎂</p><p>Эрүүл, аз жаргалтай, мөнгөтэй байгаарай 😂</p><p>Хүссэн юмаа хийж, хүссэн газраа явж, хэрэггүй юманд нервтэх нь багасаасай.</p><p>Урт юм бичвэл cringe болно. Ингээд боллоо 😂</p><div class="foot"><span>from your дүү</span><span>28.08.2026</span></div>`;const sec=msg.closest('section');if(sec){const e=sec.querySelector('.ey,.eyebrow,.lab');if(e)e.textContent='birthday note'}}
  d.querySelectorAll('.title').forEach(h=>{if(/China dump/i.test(h.textContent||''))h.textContent='random memories'});
  d.querySelectorAll('section').forEach(sec=>{const t=(sec.textContent||'').toLowerCase();if(t.includes('somehow we met in china')||t.includes('met in china')||t.includes('хятадад танилцсан')||t.includes('хадгалаад авмаар')||t.includes('worth keeping')||t.includes('ralph waldo')||t.includes('emily dickinson')||t.includes('walt whitman')||t.includes('энэ сайтыг хийхдээ')||t.includes('making of'))sec.remove()});
  const hidden=d.querySelector('#hidden,#note');if(hidden)hidden.innerHTML='<span class="ey">one extra thing</span><b>за нэг юм хэлчихье… +</b><div>Хааяа нервтүүлдэг ч гэсэн нэлээн дотно шүү 😂 За энэ хэсэг ингээд дууслаа.</div>';
  const fx=d.querySelector('#wishfx,#fx,#finalfx');if(fx){const h=fx.querySelector('h4'),p=fx.querySelector('p'),b=fx.querySelector('#fxClose,#fc,#fxclose');txt(h,'за нэг юм асууя 😂');if(p)p.innerHTML='арай Rio хүсээгүй биз? 😂<br>эсвэл billiard дээрээ сайжирмаар байна гэж хүсээгүй биз хаха';txt(b,'за больё 😂')}
  const last=d.querySelector('.last');if(last)last.innerHTML='<h3 class="rv in reveal show">төрсөн өдрийн мэнд, эгчээ 🎂</h3>';
  const end=d.querySelector('.end');if(end){end.querySelectorAll('p,small').forEach(x=>x.remove())}
  d.querySelectorAll('footer').forEach(x=>x.remove());
  ensurePhotos(d);
}catch(e){console.error(e)}}
f.addEventListener('load',()=>{patch();let n=0;const t=setInterval(()=>{patch();if(++n>22)clearInterval(t)},300)});
</script></body></html>
