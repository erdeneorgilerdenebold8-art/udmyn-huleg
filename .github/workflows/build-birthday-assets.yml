name: Build Birthday Assets

on:
  push:
    paths:
      - '.github/workflows/build-birthday-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize all 10 HQ birthday photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p birthday/final/photos birthday/final/gift
          curl -L --fail --retry 3 --connect-timeout 20 \
            'https://happy-birthday-oyunzaya-v4-fixed.vercel.app/?hq=1' \
            -o /tmp/oyunzaya-hq-bundle.html
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const boot = fs.readFileSync('/tmp/oyunzaya-hq-bundle.html', 'utf8');
          const payload = boot.match(/atob\('([^']+)'\)/);
          if (!payload) throw new Error('HQ bundle payload not found');
          const html = zlib.gunzipSync(Buffer.from(payload[1], 'base64')).toString('utf8');
          const urls = [...html.matchAll(/data:image\/(avif|jpeg|jpg|webp|png);base64,[A-Za-z0-9+/=]+/g)].map(m => m[0]).slice(0, 10);
          if (urls.length !== 10) throw new Error(`Expected 10 HQ photos, got ${urls.length}`);
          urls.forEach((url, index) => {
            const m = url.match(/^data:image\/(avif|jpeg|jpg|webp|png);base64,(.+)$/s);
            const ext = (m[1] === 'jpeg' || m[1] === 'jpg') ? 'jpg' : m[1];
            const path = `birthday/final/photos/photo${index + 1}.${ext}`;
            fs.writeFileSync(path, Buffer.from(m[2], 'base64'));
            console.log(path, fs.statSync(path).size, 'bytes');
          });
          fs.writeFileSync('birthday/final/photos/manifest.json', JSON.stringify(urls.map((u,i) => {
            const type = u.match(/^data:image\/(avif|jpeg|jpg|webp|png);base64,/)[1];
            return { n:i+1, file:`photo${i+1}.${type === 'jpeg' || type === 'jpg' ? 'jpg' : type}` };
          }), null, 2));
          NODE

      - name: Download real gift images
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 20 \
            'https://www.richrose.ae/resources/assets/uploads/product/2024-10-035816318.webp' \
            -o birthday/final/gift/flowers.webp
          curl -L --fail --retry 3 --connect-timeout 20 \
            'https://www.wine0222.com/upload/Rio%E5%BE%AE%E9%86%BA%E7%99%BD%E6%A1%83%E9%9B%9E%E5%B0%BE%E9%85%92.png' \
            -o birthday/final/gift/rio-peach.png
          curl -L --fail --retry 3 --connect-timeout 20 \
            'https://cdn.shopify.com/s/files/1/0060/6067/1058/products/RioStrongLime500mL_grande.png?v=1606887022' \
            -o birthday/final/gift/rio-lime.png
          file birthday/final/gift/* birthday/final/photos/*

      - name: Commit generated static assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add birthday/final/photos birthday/final/gift
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'Materialize all HQ birthday photos and gift images'
            git push
          fi
