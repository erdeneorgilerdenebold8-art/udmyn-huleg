/* ===== v2.4 — polished, scrollable, collapsible sidebar ===== */
.app-shell,.main,.sidebar{transition:margin-left .26s cubic-bezier(.2,.8,.2,1),transform .26s cubic-bezier(.2,.8,.2,1)}
.sidebar{height:100dvh;max-height:100dvh;overflow:hidden;will-change:transform}
.brand{flex:0 0 auto}
.nav-list{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:2px 5px 10px 0;margin-right:-5px;scrollbar-width:thin;scrollbar-color:rgba(216,177,118,.45) transparent

.nav-item:hover{transform:translateX(2px)}
.nav-item .nav-icon{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;color:#d9bb86;font-size:0}

.app-shell.sidebar-collapsed .main{margin-left:0}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(5,17,22,.42);backdrop-filter:blur(2px);z-index:19;opacity:0;pointer-events:none;transition:opacity .22s ease}

/* ===== UDMYN HULEG v3.0 — calm premium UX ===== */
:root{--radius-xl:24px;--radius-lg:18px;--radius-md:14px;--shadow-soft:0 14px 44px rgba(28,42,48,.08);--shadow-hover:0 18px 55px rgba(28,42,48,.13)}
body{font-feature-settings:"kern" 1,"liga" 1;letter-spacing:-.005em}
.content{max-width:1540px;margin:0 auto;padding:34px 36px 100px}
.topbar{height:72px;padding:0 30px;gap:14px}
.search-wrap{max-width:720px;border-radius:16px;height:44px;box-shadow:0 1px 0 rgba(255,255,255,.55) inset;transition:.18s ease}

/* ===== UDMYN HULEG v4.0 — product redesign ===== */
:root{
  --bg:#f4f5f2;--surface:#ffffff;--surface-2:#f8f9f7;--surface-3:#eef0ec;
  --text:#172126;--muted:#778085;--line:#e2e6e1;--line-strong:#d5dad4;
  --brand:#1e3036;--brand-2:#263d44;--on-brand:#ffffff;--accent:#9b6a3f;--accent-soft:#f2e8de;
  --success:#35705a;--success-soft:#e8f2ed;--danger:#9a4943;--danger-soft:#f7eae8;
  --shadow-xs:0 1px 2px rgba(18,31,36,.04);--shadow-sm:0 8px 28px rgba(20,35,40,.06);--shadow-md:0 18px 48px rgba(20,35,40,.10);
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;
}
html[data-theme="dark"]{
  --bg:#101619;--surface:#161e22;--surface-2:#1b2529;--surface-3:#202c31;
  --text:#eef2ef;--muted:#9aa5a6;--line:#29353a;--line-strong:#36444a;
  --brand:#c99b69;--brand-2:#d6aa78;--on-brand:#172126;--accent:#c99b69;--accent-soft:#30271f;
  --success:#78b493;--success-soft:#1e3028;--danger:#e2918b;--danger-soft:#352321;
  --shadow-xs:0 1px 2px rgba(0,0,0,.12);--shadow-sm:0 10px 32px rgba(0,0,0,.18);--shadow-md:0 22px 56px rgba(0,0,0,.28);
}
html,body{background:var(--bg)!important;color:var(--text)!important}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important;font-size:14px}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent);outline-offset:2px}

/* shell */
.sidebar{width:252px!important;background:#f1f2ef!important;color:var(--text)!important;border-right:1px solid var(--line)!important;box-shadow:none!important;padding:18px 12px 14px!important}
.main{margin-left:252px!important;background:var(--bg)!important}

.brand{padding:2px 7px 16px!important;gap:10px!important}
.brand-mark{width:38px!important;height:38px!important;border-radius:12px!important;background:var(--brand)!important;color:var(--on-brand)!important;border:0!important;box-shadow:var(--shadow-xs)!important}
.brand-mark svg{width:26px!important;height:26px!important}
.brand-title{font-size:13px!important;letter-spacing:.045em!important;color:var(--text)!important;font-weight:850!important}
.brand-subtitle{font-size:9px!important;line-height:1.35!important;color:var(--muted)!important;opacity:1!important;max-width:155px!important}
.nav-list{gap:2px!important;padding:0 2px 10px 0!important;scrollbar-color:var(--line-strong) transparent!important}
.nav-section-label{border:0!important;margin:13px 10px 4px!important;padding:0!important;font-size:8px!important;letter-spacing:.12em!important;color:#929b9b!important;font-weight:800!important}
.nav-section-first{margin-top:14px!important}
.nav-item{min-height:39px!important;padding:8px 10px!important;border-radius:10px!important;color:#596367!important;gap:10px!important;transform:none!important}

.nav-item.active{background:var(--surface)!important;color:var(--text)!important;box-shadow:0 0 0 1px var(--line),var(--shadow-xs)!important}

#quickPhotoBtn{display:none!important}

/* content */
.content{max-width:1480px!important;padding:30px 34px 90px!important}
.v4-page-head{align-items:flex-start!important;margin-bottom:22px!important;padding-bottom:0!important}
.page-title .eyebrow{font-size:8px!important;letter-spacing:.14em!important;color:var(--accent)!important;margin-bottom:5px!important}
.page-title h1{font-size:27px!important;line-height:1.15!important;letter-spacing:-.035em!important;margin:0 0 7px!important;color:var(--text)!important}
.page-title p{font-size:12px!important;line-height:1.6!important;color:var(--muted)!important;max-width:720px!important}
.page-head-actions{display:flex;align-items:center;gap:8px;margin-top:3px}.page-date{font-size:10px;color:var(--muted);padding:7px 0}
.primary-btn,.ghost-btn,.secondary-btn,.danger-btn,.restore-btn{min-height:38px!important;padding:9px 13px!important;border-radius:10px!important;font-size:11px!important;font-weight:750!important;box-shadow:none!important;transform:none!important}
.primary-btn{background:var(--brand)!important;color:var(--on-brand)!important}.primary-btn:hover{background:var(--brand-2)!important}
.ghost-btn{background:var(--surface)!important;border-color:var(--line)!important;color:var(--text)!important}.ghost-btn:hover{border-color:var(--line-strong)!important;background:var(--surface-2)!important}
.secondary-btn{background:var(--accent-soft)!important;border-color:transparent!important;color:var(--accent)!important}.danger-btn{background:var(--danger-soft)!important;border-color:transparent!important;color:var(--danger)!important}.quiet-danger{margin-left:auto}
.text-link{font-size:10px!important;color:var(--accent)!important;font-weight:750!important}

/* Dashboard */
.dash-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:8px 0 24px}.dash-overline{display:block;font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-bottom:7px}.dash-intro h1{font-size:30px;line-height:1.1;letter-spacing:-.04em;margin:0 0 8px;color:var(--text)}.dash-intro p{max-width:680px;margin:0;color:var(--muted);font-size:12px;line-height:1.65}.dash-intro-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.overview-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}.overview-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 16px;text-align:left;color:var(--text);box-shadow:var(--shadow-xs);transition:.16s}.overview-card:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}.overview-label{display:block;font-size:9px;color:var(--muted);font-weight:650;margin-bottom:14px}.overview-card strong{display:block;font-size:28px;line-height:1;letter-spacing:-.05em;margin-bottom:7px}.overview-card small{display:block;font-size:9px;color:#90999a}
.dash-main-grid{display:grid;grid-template-columns:1fr;gap:14px}.dash-lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.dash-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-xs);overflow:hidden}.dash-panel-head{min-height:64px;padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dash-panel-head span{display:block;font-size:7.5px;color:var(--accent);font-weight:800;letter-spacing:.13em;margin-bottom:4px}.dash-panel-head h2{font-size:13px;margin:0;color:var(--text);letter-spacing:-.01em}
.recent-list{padding:5px}.recent-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto 18px;gap:10px;align-items:center;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:11px;text-align:left;transition:.13s}.recent-row:hover{background:var(--surface-2)}.recent-thumb{width:42px;height:42px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;color:var(--accent);font-size:10px;font-weight:850;background-size:cover;background-position:center}.recent-main b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-main small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.recent-type{font-size:8px;color:var(--muted);padding:5px 7px;border:1px solid var(--line);border-radius:999px}.recent-arrow{color:#a0a7a7}

/* surfaces / tables / cards */

  <script>
const SUPABASE_URL = 'https://skqcazprznajwmqhwrfb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zvZ_lZI0wA5vujb2KcsxyQ_HTIQGzpM';
const AUTH_STORAGE_KEY = 'udmyn_huleg_cloud_session_v21';
const $ = (s)=>document.querySelector(s);
const $$ = (s)=>[...document.querySelectorAll(s)];
let cloudSession = null;
try { cloudSession = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null'); } catch {}
function persistSession(session){ cloudSession=session||null; if(session)localStorage.setItem(AUTH_STORAGE_KEY,JSON.stringify(session)); else localStorage.removeItem(AUTH_STORAGE_KEY); }
function sessionExpiredSoon(s){ return !s?.access_token || ((s.expires_at||0)*1000 - Date.now() < 60000); }
async function refreshCloudSession(){
  if(!cloudSession) return null;
  if(!sessionExpiredSoon(cloudSession)) return cloudSession;
  if(!cloudSession.refresh_token){persistSession(null);return null;}
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});
    if(!r.ok){persistSession(null);return null;} const j=await r.json(); j.expires_at=j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600); persistSession(j); return j;
  }catch(e){console.error(e);return cloudSession;}
}
async function authedFetch(path,options={}){
  const session=await refreshCloudSession(); if(!session?.access_token) throw new Error('Нэвтрэх шаардлагатай.');
  const headers={apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${session.access_token}`,...(options.headers||{})};
  return fetch(`${SUPABASE_URL}${path}`,{...options,headers});
}
async function authSignIn(email,password){
  try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}); const j=await r.json(); if(!r.ok)return {error:j}; j.expires_at=j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600); persistSession(j); return {data:{session:j,user:j.user},error:null};}catch(error){return {error};}
}
async function authGetSession(){const s=await refreshCloudSession();return {data:{session:s},error:null};}
async function authGetUser(){
  try{const s=await refreshCloudSession(); if(!s?.access_token)return {data:{user:null},error:new Error('No session')}; const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${s.access_token}`}}); const j=await r.json(); if(!r.ok)return {data:{user:null},error:j}; return {data:{user:j},error:null};}catch(error){return {data:{user:null},error};}
}
async function authSignOut(){try{const s=cloudSession;if(s?.access_token)await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${s.access_token}`}});}catch{}persistSession(null);}
async function dbSelect(table,select,filters={},opts={}){
  const q=new URLSearchParams(); q.set('select',select); for(const [k,v] of Object.entries(filters))q.set(k,`eq.${v}`); if(opts.order)q.set('order',`${opts.order}.asc`);
  const r=await authedFetch(`/rest/v1/${table}?${q.toString()}`,{headers:{Accept:'application/json'}}); const j=await r.json(); if(!r.ok)throw j; return j;
}
async function dbUpdate(table,values,filters={}){
  const q=new URLSearchParams(); for(const [k,v] of Object.entries(filters))q.set(k,`eq.${v}`);
  const r=await authedFetch(`/rest/v1/${table}?${q.toString()}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(values)}); if(!r.ok){let j={};try{j=await r.json()}catch{}throw j;} return true;
}
async function storageUpload(bucket,path,file,contentType){const r=await authedFetch(`/storage/v1/object/${bucket}/${encodeURI(path)}`,{method:'POST',headers:{'Content-Type':contentType||file.type||'application/octet-stream','x-upsert':'false'},body:file}); if(!r.ok){let j={};try{j=await r.json()}catch{}throw j;} return true;}
async function storageSignedUrl(bucket,path,expiresIn=86400){const r=await authedFetch(`/storage/v1/object/sign/${bucket}/${encodeURI(path)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn})}); const j=await r.json(); if(!r.ok)throw j; let u=j.signedURL||j.signedUrl||''; if(u&&u.startsWith('/object/'))u=`${SUPABASE_URL}/storage/v1${u}`; else if(u&&u.startsWith('/storage/v1/'))u=SUPABASE_URL+u; else if(u&&u.startsWith('/'))u=SUPABASE_URL+u; return u;}

const THEME_STORAGE_KEY='udmyn_huleg_theme_v1';
function getTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light';}
function updateThemeControls(){
  const dark=getTheme()==='dark';
  const icon=$('#themeToggleIcon'),txt=$('#themeToggleText');
  if(icon)icon.textContent=dark?'☀':'☾';
  if(txt)txt.textContent=dark?'Light':'Dark';
  $$('.appearance-choice').forEach(x=>x.classList.toggle('current',x.dataset.themeChoice===getTheme()));
}
function applyTheme(theme,persist=true){
  const t=theme==='dark'?'dark':'light';
  document.documentElement.dataset.theme=t;
  if(persist)localStorage.setItem(THEME_STORAGE_KEY,t);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta)meta.setAttribute('content',t==='dark'?'#0f171b':'#0c2430');

function ageText(birthDate, birthYear){

  if(!d || Number.isNaN(d.getTime())) return '—';
  const now=new Date(); let years=now.getFullYear()-d.getFullYear(); let months=now.getMonth()-d.getMonth();
  if(now.getDate()<d.getDate()) months--;
  if(months<0){years--;months+=12;}

function mongolianDayName(date){
  const anchor=Date.UTC(2026,7,13); // 2026-08-13 = шарагчин хонь
  const stems=['хөх','хөхөгчин','улаан','улаагчин','шар','шарагчин','цагаан','цагаагчин','хар','харагчин'];
  const animals=['хулгана','үхэр','барс','туулай','луу','могой','морь','хонь','бич','тахиа','нохой','гахай'];
  const anchorStem=5, anchorAnimal=7;
  const days=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-anchor)/86400000);
  const mod=(n,m)=>(n%m+m)%m;
  return `${stems[mod(anchorStem+days,10)]} ${animals[mod(anchorAnimal+days,12)]}`;
}

function lunarInfoForDate(date){
  const key=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  if(date.getFullYear()!==2026 || key<'2026-02-18')return null;
  for(let i=LUNAR_2026_MONTHS.length-1;i>=0;i--){
    const [start,name,days]=LUNAR_2026_MONTHS[i];
    if(key>=start){
      const diff=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.parse(start+'T00:00:00Z'))/86400000);
      if(diff>=0 && diff<days.length)return {day:days[diff],month:name,dayName:mongolianDayName(date)};
    }
  }
  return null;
}

  const lunar=li?`Билгийн тооллын шинийн ${li.day} · <b>${esc(li.dayName)} өдөр</b> · ${esc(li.month)} сар`:'Билгийн мэдээлэл байхгүй';
  const weatherCards=WEATHER_PLACES.map(place=>{
    const w=dashboardWeather[place.key]||{loading:true};
    if(w.loading)return `<div class="daily-weather weather-loading"><div class="weather-icon">◌</div><div class="weather-copy"><div class="weather-place">${place.name}</div><strong>—°</strong><small>Татаж байна</small></div></div>`;
    if(w.error)return `<div class="daily-weather"><div class="weather-icon">🌤️</div><div class="weather-copy"><div class="weather-place">${place.name}</div><strong>—</strong><small>Мэдээлэлгүй</small></div></div>`;
    return `<div class="daily-weather"><div class="weather-icon">${weatherSymbol(w.code)}</div><div class="weather-copy"><div class="weather-place">${place.name}</div><strong>${w.temp}°C</strong><small>${weatherLabel(w.code)} · ${w.min}°/${w.max}°</small></div></div>`;
  }).join('');
  return `<div class="daily-context"><div class="daily-date"><div class="gregorian">${greg}</div><div class="lunar">${lunar}</div></div><div class="daily-weather-grid">${weatherCards}</div></div>`;
}

function photoForHorse(id){ return state.photos.filter(p=>p.horseId===id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0] || null; }
let imageLightboxIds=[];
let imageLightboxIndex=0;
function renderImageLightbox(){
  const id=imageLightboxIds[imageLightboxIndex],p=state.photos.find(x=>x.id===id);
  if(!p){closeImageLightbox();return;}
  const horse=state.horses.find(x=>x.id===p.horseId);
  $('#imageLightboxImg').src=p.dataUrl||'';
  $('#imageLightboxImg').alt=`${horse?.display||'Адуу'} — зураг`;
  $('#imageLightboxCaption').innerHTML=`<b>${esc(horse?.display||'Адуу')}</b><small>${p.year||'—'} · ${esc(p.type||'Зураг')}${p.caption?` · ${esc(p.caption)}`:''}</small>`;
  const many=imageLightboxIds.length>1;
  $('#imageLightboxPrev').hidden=!many;$('#imageLightboxNext').hidden=!many;
}
function openImageLightbox(photoId){
  const p=state.photos.find(x=>x.id===photoId);if(!p?.dataUrl)return;
  imageLightboxIds=state.photos.filter(x=>x.horseId===p.horseId&&x.dataUrl).slice().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).map(x=>x.id);
  if(!imageLightboxIds.length)imageLightboxIds=[photoId];
  imageLightboxIndex=Math.max(0,imageLightboxIds.indexOf(photoId));
  $('#imageLightbox').hidden=false;document.body.classList.add('lightbox-open');renderImageLightbox();
}
function closeImageLightbox(){const lb=$('#imageLightbox');if(lb)lb.hidden=true;document.body.classList.remove('lightbox-open');}
function stepImageLightbox(delta){if(imageLightboxIds.length<2)return;imageLightboxIndex=(imageLightboxIndex+delta+imageLightboxIds.length)%imageLightboxIds.length;renderImageLightbox();}
window.openImageLightbox=openImageLightbox;window.closeImageLightbox=closeImageLightbox;

function pedigreeRelationLabel(path){
  if(!path.length)return 'Одоогийн адуу';
  return path.map(x=>x==='sire'?'Эцэг':'Эх').join(' → ');
}
function buildPedigreeLevels(root){
  const rootKey=String(root.display||'').toLocaleLowerCase('mn-MN');
  const levels=[[{name:root.display,horse:root,path:[],external:false,trail:[rootKey]}]];
  let frontier=levels[0];
  const MAX_SAFE_DEPTH=24;
  for(let depth=0;frontier.length&&depth<MAX_SAFE_DEPTH;depth++){
    const next=[];
    for(const node of frontier){
      if(!node.horse)continue;
      for(const edge of ['sire','dam']){
        const name=String(node.horse[edge]||'').trim();
        if(!name)continue;
        const normalized=name.toLocaleLowerCase('mn-MN'),cycle=node.trail.includes(normalized),ancestor=cycle?null:horseByDisplay(name);
        next.push({name,horse:ancestor,path:[...node.path,edge],external:!ancestor||cycle,trail:[...node.trail,normalized]});
      }
    }
    if(!next.length)break;
    levels.push(next);frontier=next;
  }
  return levels;
}
function pedigreeNode(node,isRoot=false){
  const h=node.horse,meta=h?[birthYearOf(h)||'',h.color||''].filter(Boolean).join(' · '):'Дэлгэрэнгүй бүртгэлгүй';
  const cls=`pedigree-node${isRoot?' current':''}${node.external?' external':''}`,click=h&&!isRoot?` onclick="openHorse('${h.id}')"`:'',tag=h&&!isRoot?'button':'div';
  return `<${tag} class="${cls}"${click}><span class="relation">${esc(pedigreeRelationLabel(node.path))}</span><b>${esc(node.name)}</b><small>${esc(meta||'Мэдээлэл дутуу')}</small></${tag}>`;
}

  const x=state.horses.find(h=>h.id===selectedHorseId)||state.horses[0];selectedHorseId=x.id;

function cattleBirthYearOf(x){return +(x?.birthDate?.slice(0,4)||x?.birth||0)||null;}

function cattleColorField(selected=''){return `<div class="field"><label>ЗҮС *</label><select name="cattleColor" required data-inline-create="cattleColor"><option value="">— Сонгох —</option>${optionList(state.cattleColors,selected)}<option value="__new__">＋ Шинэ зүс нэмэх</option></select><div class="inline-create" data-inline-field="cattleColor" hidden><input name="cattleColor_new" placeholder="Жишээ: Бор алаг"><small>Үхрийн зүсний тусдаа санд хадгалагдана.</small></div></div>`;}
function cattleColorFromForm(fd){let c=fd.get('cattleColor');if(c==='__new__'){c=(fd.get('cattleColor_new')||'').trim();if(c&&!state.cattleColors.some(x=>x.toLowerCase()===c.toLowerCase()))state.cattleColors.push(c);}return c||'Тодорхойгүй';}
function cattleDisplayName({name,type,color,birthDate,mother,gender}){if(name?.trim())return name.trim();const y=birthDate?.slice(0,4)||'';if(type==='Тугал')return `${mother?mother.replace(/ үнээ$/,'')+' үнээний ':''}${y?y+' оны ':''}${String(color||'').toLowerCase()} ${gender==='Эр'?'эр ':gender==='Эм'?'эм ':''}тугал`.trim();return `${color||''} ${type||'үхэр'}`.trim();}
function cattlePhotoFor(id){return state.cattlePhotos.filter(p=>p.cattleId===id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0]||null;}
function cattleVisual(x,cls='horse-photo',badge=''){const p=cattlePhotoFor(x.id);if(p)return `<div class="${cls} has-img" style="background-image:url('${p.dataUrl}')">${badge}</div>`;return `<div class="${cls} cattle-placeholder">${COW_ICON}${badge}</div>`;}
function cattleRow(x){const p=cattlePhotoFor(x.id),avatar=p?`<div class="mini-avatar photo" style="background-image:url('${p.dataUrl}')"></div>`:`<div class="mini-avatar cattle-placeholder">${COW_ICON}</div>`;return `<tr onclick="openCattle('${x.id}')"><td><div class="mini-horse">${avatar}<div><b>${esc(x.display)}</b><br><small>${esc(x.id)}</small></div></div></td><td>${esc(x.type||'—')}${x.gender?`<br><small>${esc(x.gender)}</small>`:''}</td><td>${x.birthDate?dateMn(x.birthDate):(cattleBirthYearOf(x)||'—')}<br><small>${cattleAgeText(x)}</small></td><td>${esc(x.color||'—')}</td><td>${esc(x.earMark||'—')}</td><td>${esc(x.origin||'—')}</td></tr>`;}
function cattle(){const list=state.cattle.filter(x=>x.type!=='Тугал');return `${pageHead('ҮХРИЙН БҮРТГЭЛ','Бүх үхэр','Адууны сангаас бүрэн тусдаа. Үхрийг нас, зүс, чихний чихлээс болон таних тэмдгээр нь бүртгэнэ.',editOnly('<button class="primary-btn" onclick="openCattleForm()">＋ Үхэр бүртгэх</button>'))}${list.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Үхэр</th><th>Төрөл</th><th>Төрсөн / нас</th><th>Зүс</th><th>Чихний чихлээс / тэмдэг</th><th>Гарал</th></tr></thead><tbody>${list.map(cattleRow).join('')}</tbody></table></div>`:emptyState('◇','Үхэр бүртгэлгүй','Үхрийн бүртгэл адуунаас тусдаа энд хадгалагдана.',editOnly('<button class="primary-btn" onclick="openCattleForm()">＋ Үхэр бүртгэх</button>'))}`;}
function cattleCalves(){const list=state.cattle.filter(x=>x.type==='Тугал');return `${pageHead('ТУГАЛ','Тугалын бүртгэл','Тугал бүрийг эх үнээ, төрсөн огноо, нас, зүс, чихний чихлээсээр нь тусад нь бүртгэнэ.',editOnly('<button class="primary-btn" onclick="openCattleForm(\'\',\'Тугал\')">＋ Тугал бүртгэх</button>'))}${list.length?`<div class="cards-grid">${list.map(x=>`<article class="horse-card" onclick="openCattle('${x.id}')">${cattleVisual(x,'horse-photo',`<span class="tag">${cattleBirthYearOf(x)||'—'}</span>`)}<div class="horse-card-body"><h3>${esc(x.display)}</h3><p>Эх: ${esc(x.mother||'—')} · Эцэг: ${esc(x.father||'—')}</p><div class="card-footer"><span>${esc(x.color||'—')} · ${esc(x.gender||'—')}</span><span>${cattleAgeText(x)}</span></div></div></article>`).join('')}</div>`:emptyState('◇','Тугал бүртгэлгүй','Шинэ тугал бүрийг энд бүртгэнэ.',editOnly('<button class="primary-btn" onclick="openCattleForm(\'\',\'Тугал\')">＋ Тугал бүртгэх</button>'))}`;}

  <div class="record-content-grid"><main class="record-main-col"><section class="info-panel"><div class="section-heading"><div><span>ТАНИХ МЭДЭЭЛЭЛ</span><h2>Үндсэн бүртгэл</h2></div></div><div class="info-grid clean-info-grid">${info('Төрөл',esc(x.type||'—'))}${info('Хүйс',esc(x.gender||'—'))}${info('Төрсөн огноо',x.birthDate?dateMn(x.birthDate):cattleBirthYearOf(x)||'—')}${info('Нас',cattleAgeText(x))}${info('Зүс',esc(x.color||'—'))}${info('Чихний чихлээс / тэмдэг',esc(x.earMark||'—'))}${info('Гарал',esc(x.origin||'—'))}</div></section>${pp.length?`<section class="info-panel"><div class="section-heading"><div><span>ЗУРАГ</span><h2>Зургийн архив <small>${pp.length}</small></h2></div></div><div class="photo-strip modern-photo-strip">${pp.slice(0,8).map(p=>`<div class="photo-tile" style="background-image:url('${p.dataUrl}')"><span>${p.year||'—'}</span></div>`).join('')}</div></section>`:''}${x.notes?`<section class="info-panel"><div class="section-heading"><div><span>ТЭМДЭГЛЭЛ</span><h2>Нэмэлт мэдээлэл</h2></div></div><div class="note-box">${esc(x.notes)}</div></section>`:''}</main><aside class="record-side-col"><section class="info-panel sticky-side"><div class="section-heading"><div><span>ГАРАЛ</span><h2>Эцэг, эх</h2></div></div><div class="parent-card static"><small>ЭХ ҮНЭЭ</small><b>${esc(x.mother||'Тодорхойгүй')}</b></div><div class="parent-card static"><small>ЭЦЭГ БУХ</small><b>${esc(x.father||'Тодорхойгүй')}</b></div><div class="side-subsection"><div class="side-subhead"><b>Таних тэмдэг</b></div><div class="brand-summary"><strong>${esc(x.earMark||'—')}</strong></div></div></section></aside></div>`;
}

window.openCattleForm=(id='',forceType='')=>{if(!canEdit()){toast('Танд бүртгэл нэмэх/засах эрх байхгүй.');return;}const x=id?state.cattle.find(c=>c.id===id):null;const dateVal=x?.birthDate||'';const type=forceType||x?.type||'Үнээ';const mothers=state.cattle.filter(c=>c.type==='Үнээ'&&c.id!==id).map(c=>c.display);const fathers=state.cattle.filter(c=>c.type==='Бух'&&c.id!==id).map(c=>c.display);showModal(x?'Үхрийн мэдээлэл засах':type==='Тугал'?'Шинэ тугал бүртгэх':'Шинэ үхэр бүртгэх',`<form class="form-body" id="cattleForm"><input type="hidden" name="cattleId" value="${x?.id||''}"><input type="hidden" name="submissionKey" value="${newSubmissionKey(x?'cattle-edit':'cattle')}"><div class="form-grid"><div class="field"><label>ТАНИХ НЭР / ДУГААР (БАЙВАЛ)</label><input name="name" value="${esc(x?.name||'')}" placeholder="Нэргүй байж болно"></div><div class="field"><label>ТӨРӨЛ *</label><select name="cattleType">${optionList(['Үнээ','Бух','Шар','Тугал'],type)}</select></div><div class="field"><label>ХҮЙС</label><select name="gender"><option value="">— Сонгох —</option>${optionList(['Эр','Эм'],x?.gender||'')}</select></div>${cattleColorField(x?.color||'')}<div class="field"><label>ТӨРСӨН ОГНОО / НАС</label><input name="cattleBirthDate" type="date" value="${dateVal}"><small class="age-live" id="liveCattleAge">${dateVal?`Нас: ${ageText(dateVal)}`:'Огноо оруулахад нас автоматаар бодогдоно'}</small></div><div class="field"><label>НАС (ТӨРСӨН ОГНОО МЭДЭХГҮЙ БОЛ)</label><input name="approxAge" type="number" min="0" max="40" step="1" value="${esc(x?.approxAge||'')}" placeholder="Жишээ: 5"></div><div class="field"><label>ЧИХНИЙ ЧИХЛЭЭС / ТАНИХ ТЭМДЭГ *</label><input name="earMark" required value="${esc(x?.earMark||'')}" placeholder="Жишээ: Баруун чих урд талаас цуулбар"></div><div class="field"><label>ЭХ ҮНЭЭ</label><select name="mother"><option value="">— Сонгох —</option>${optionList(mothers,x?.mother||'')}</select></div><div class="field"><label>ЭЦЭГ БУХ</label><select name="father"><option value="">— Сонгох —</option>${optionList(fathers,x?.father||'')}</select></div><div class="field full"><label>ГАРАЛ / ХААНААС ИРСЭН</label><input name="origin" value="${esc(x?.origin||'')}" placeholder="Өөрийн малаас / худалдаж авсан газар"></div>${photoInput('cattlePhoto',x?'НЭМЭЛТ ЗУРАГ':'АНХНЫ ЗУРАГ')}<div class="field full"><label>НЭМЭЛТ ТЭМДЭГЛЭЛ</label><textarea name="note" rows="3">${esc(x?.notes||'')}</textarea></div></div><div class="ownership-note">Үхрийн бүртгэл адууны мэдээлэлтэй холилдохгүй, тусдаа санд хадгалагдана.</div>${formActions(x?'Өөрчлөлт хадгалах':type==='Тугал'?'Тугал бүртгэх':'Үхэр бүртгэх')}</form>`);};
async function addCattlePhotoFromFile(file,cattleId,year=CURRENT_YEAR){if(!file||!file.size)return null;const uploaded=await uploadPrivateImage(file,'cattle');const p={id:`CP-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,cattleId,path:uploaded.path,dataUrl:uploaded.url,year:+year||CURRENT_YEAR,createdAt:new Date().toISOString()};state.cattlePhotos.push(p);return p;}

async function compressImage(file){
  if(!file||!file.size)return '';
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
  return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.78));};img.onerror=()=>resolve(raw);img.src=raw;});
}

async function passwordHash(value){
  try{const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  catch{return btoa(unescape(encodeURIComponent(value)));}
}

function configureAuthLayer(){
  const setup=needsInitialSetup;
  $('#familyNameWrap').hidden=!setup;
  $('#displayNameWrap').hidden=!setup;
  $('#loginAction').textContent=setup?'Анхны админ үүсгэх':'Нэвтрэх';
  $('#loginNote').textContent=setup
    ? 'Анхны тохиргоо: гэр бүлийн нэр болон Admin хэрэглэгчээ үүсгэнэ үү.'
    : 'Гэр бүлийн өөрийн username/password-аар нэвтэрнэ үү.';
  $('#loginSubtitle').textContent=state.settings.familyTitle||'Адууны бүртгэл · Удам · Сүрэг';
}
async function checkSetupStatus(){
  // Production family is already initialized. Default to normal login even if the
  // setup-status request is temporarily unavailable. Only explicit needsSetup=true
  // may switch the screen into first-admin setup mode.
  needsInitialSetup=false;
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/family-setup-status`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});
    const out=await res.json();
    if(res.ok && out?.needsSetup===true) needsInitialSetup=true;
  }catch(e){console.error('Setup status check failed; continuing with normal login.',e); needsInitialSetup=false;}
  configureAuthLayer();
}
async function handleLogin(e){
  e.preventDefault();
  const btn=$('#loginAction');
  const username=normalizeUsername($('#username').value),password=$('#password').value;
  if(!username||!password){toast('Username болон нууц үгээ оруулна уу.');return;}
  if(btn){btn.disabled=true;btn.textContent='Нэвтэрч байна…';}
  try{
  if(needsInitialSetup){
    const familyName=$('#familyName').value.trim(),name=$('#displayName').value.trim(); if(!familyName){toast('Гэр бүлийн нэрийг оруулна уу.');return;} if(!name){toast('Таны нэрийг оруулна уу.');return;}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/bootstrap-family-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({familyName,displayName:name,username,password})}); const out=await res.json(); if(!res.ok){toast(out.error||'Анхны админ үүсгэхэд алдаа гарлаа');return;}
    needsInitialSetup=false;
  }
  const {error}=await authSignIn(loginEmail(username),password); if(error){console.error('Auth failed',error);toast('Username эсвэл нууц үг буруу байна.');return;}
    try{
      const loaded=await loadCloudState();
      if(!loaded) throw new Error('Cloud profile ачаалсангүй');
      await startRealtime();
      $('#loginLayer').classList.add('hidden'); syncShell(); toast('Тавтай морил'); render();
    }catch(err){console.error('Post-login load failed',err);toast('Нэвтэрсэн боловч cloud мэдээлэл ачаалсангүй. Дахин оролдоно уу.');}
  }catch(err){
    console.error('Login failed',err);
    toast('Нэвтрэх үед алдаа гарлаа. Дахин оролдоно уу.');
  }finally{
    if(btn){btn.disabled=false;configureAuthLayer();}
  }
}
async function bootstrapApp(){
  await checkSetupStatus();
  const {data:{session}}=await authGetSession();
  if(session){ try{await loadCloudState(); await startRealtime(); $('#loginLayer').classList.add('hidden');}catch(e){console.error(e); await authSignOut();} }
  syncShell(); render();
}

function openSidebar(){setSidebarCollapsed(false);}
$('#mobileMenu').addEventListener('click',toggleSidebar);
$('#sidebarBackdrop').addEventListener('click',closeSidebar);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#appShell').classList.contains('sidebar-collapsed'))closeSidebar();});
// Narrow screens start as a drawer; wider screens start open. Every menu choice closes it cleanly.
setSidebarCollapsed(innerWidth<=1100);
$$('[data-mobile-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.mobileView)));
$('#mobileAddBtn')?.addEventListener('click',openPrimaryCreate);
$('#mobileMoreBtn')?.addEventListener('click',()=>openSidebar());
function syncMobileNav(){const nav=$('#mobileBottomNav');if(!nav)return;$$('[data-mobile-view]').forEach(b=>b.classList.toggle('active',b.dataset.mobileView===currentView));}
const _renderV3=render;render=function(){_renderV3();syncMobileNav();};
$('#globalSearch').addEventListener('input',e=>{window.__globalQuery=e.target.value.trim();if(window.__globalQuery.length>0){currentView='searchResults';render();}else{currentView='dashboard';render();}});

bootstrapApp().catch(err=>{console.error(err);toast('App эхлүүлэх үед алдаа гарлаа.');});

</script>
